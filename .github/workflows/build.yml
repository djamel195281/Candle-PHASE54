
name: Candle PHASE54 - Compilation Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Qt 5.12.12 et MinGW 7.3.0
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.12.12'
          arch: 'win32_mingw73'
          tools: 'tools_mingw,qt.tools.win32_mingw730'
          modules: 'qtscript'
          cache: false

      - name: Verifier Qt et MinGW
        shell: pwsh
        run: |
          Write-Host "QT_ROOT_DIR = $env:QT_ROOT_DIR"
          & g++.exe --version

          $scriptConfig = Get-ChildItem $env:QT_ROOT_DIR `
            -Filter Qt5ScriptConfig.cmake -Recurse |
            Select-Object -First 1

          if (-not $scriptConfig) {
            throw "Qt5Script absent."
          }

          Write-Host "Qt5Script trouve."

      - name: Extraire les sources Candle
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Path . -Filter "*.zip" |
            Where-Object { $_.Name -like "*PHASE54-CLOUD-BUILD*" } |
            Select-Object -First 1

          if (-not $zip) {
            throw "Archive PHASE54 introuvable."
          }

          Expand-Archive -LiteralPath $zip.FullName `
            -DestinationPath "$env:GITHUB_WORKSPACE\source" -Force

      - name: Localiser CMakeLists principal
        shell: pwsh
        run: |
          $cmake = Get-ChildItem "$env:GITHUB_WORKSPACE\source" `
            -Filter CMakeLists.txt -Recurse |
            Where-Object {
              (Test-Path (Join-Path $_.Directory.FullName "src")) -and
              (Test-Path (Join-Path $_.Directory.FullName "src/candle"))
            } |
            Select-Object -First 1

          if (-not $cmake) {
            throw "CMakeLists principal introuvable."
          }

          "SOURCE_DIR=$($cmake.Directory.FullName)" |
            Out-File -FilePath $env:GITHUB_ENV -Append

          Write-Host "Sources : $($cmake.Directory.FullName)"

      - name: Corriger les references Qt5
        shell: pwsh
        run: |
          $main = Join-Path $env:SOURCE_DIR "src/candle/CMakeLists.txt"

          if (-not (Test-Path $main)) {
            throw "CMakeLists Candle introuvable."
          }

          $content = Get-Content -LiteralPath $main -Raw

          $content = $content.Replace(
            'Qt${QT_VERSION}::lupdate',
            'Qt5::lupdate'
          )

          Set-Content -LiteralPath $main -Value $content -Encoding utf8

          $ui = Join-Path $env:SOURCE_DIR `
            "src/scriptbindings/qtbindings/qtscript_uitools/CMakeLists.txt"

          if (-not (Test-Path $ui)) {
            throw "CMakeLists UiTools introuvable."
          }

          $uiContent = Get-Content -LiteralPath $ui -Raw

          $uiContent = $uiContent.Replace(
            'Qt::UiTools',
            'Qt5::UiTools'
          )

          Set-Content -LiteralPath $ui -Value $uiContent -Encoding utf8

          if ($uiContent.Contains('Qt::UiTools')) {
            throw "Correction Qt5 UiTools non appliquee."
          }

          if ($content.Contains('Qt${QT_VERSION}::lupdate')) {
            throw "Correction lupdate non appliquee."
          }

          Write-Host "References Qt5 corrigees."

      - name: Corriger les inclusions customwidgets
        shell: pwsh
        run: |
          $custom = Join-Path $env:SOURCE_DIR `
            "src/customwidgets/CMakeLists.txt"

          if (-not (Test-Path $custom)) {
            throw "CMakeLists customwidgets introuvable."
          }

          $content = Get-Content -LiteralPath $custom -Raw

          if ($content -notmatch 'target_include_directories\s*\(\s*customwidgets') {
            Add-Content -LiteralPath $custom -Value "`r`ntarget_include_directories(customwidgets PRIVATE `${CMAKE_CURRENT_SOURCE_DIR})"
          }

          Write-Host "Chemin d'inclusion customwidgets configure."

      - name: Corriger le metatype QSocketNotifier
        shell: pwsh
        run: |
          $file = Join-Path $env:SOURCE_DIR `
            "src/scriptbindings/generated_cpp/com_trolltech_qt_core/qtscript_QSocketNotifier.cpp"

          if (-not (Test-Path $file)) {
            throw "Fichier qtscript_QSocketNotifier.cpp introuvable."
          }

          $content = Get-Content -LiteralPath $file -Raw

          if (-not $content.Contains('Q_DECLARE_METATYPE(QSocketNotifier::Type)')) {
            $prefix = "#include <QMetaType>`r`n#include <QSocketNotifier>`r`nQ_DECLARE_METATYPE(QSocketNotifier::Type)`r`n"

            Set-Content -LiteralPath $file `
              -Value ($prefix + $content) -Encoding utf8
          }

          $check = Get-Content -LiteralPath $file -Raw

          if (-not $check.Contains('Q_DECLARE_METATYPE(QSocketNotifier::Type)')) {
            throw "Declaration du metatype QSocketNotifier absente."
          }

          Write-Host "Metatype QSocketNotifier::Type declare."

      - name: Corriger la fonction mathematique trunc
        shell: pwsh
        run: |
          $file = Join-Path $env:SOURCE_DIR "src/candle/utils/util.h"

          if (-not (Test-Path $file)) {
            throw "Fichier util.h introuvable."
          }

          $content = Get-Content -LiteralPath $file -Raw

          if ($content -notmatch '#include\s*<cmath>') {
            $content = "#include <cmath>`r`n" + $content
          }

          $content = $content.Replace(
            'return value - trunc(value / 360.0) * 360.0;',
            'return value - std::trunc(value / 360.0) * 360.0;'
          )

          Set-Content -LiteralPath $file -Value $content -Encoding utf8

          if ($content -notmatch 'std::trunc') {
            throw "Correction de std::trunc non appliquee."
          }

          Write-Host "Correction std::trunc appliquee."

      - name: Configurer le projet
        shell: pwsh
        run: |
          cmake -S "$env:SOURCE_DIR" -B build `
            -G "MinGW Makefiles" `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

          if ($LASTEXITCODE -ne 0) {
            throw "La configuration CMake a echoue."
          }

      - name: Compiler Candle
        shell: pwsh
        run: |
          Write-Host "===== DEBUT COMPILATION PHASE54 ====="

          cmake --build build --parallel 1 --verbose 2>&1 |
            Tee-Object -FilePath build.log

          $buildExit = $LASTEXITCODE

          Write-Host "===== FIN COMPILATION ====="
          Write-Host "Code retour : $buildExit"

          if ($buildExit -ne 0) {
            Write-Host "===== RECHERCHE DE LA PREMIERE ERREUR ====="

            $log = Get-Content build.log

            $matches = Select-String -Path build.log `
              -Pattern 'error:|fatal error:|undefined reference|No such file|Error [0-9]+'

            if ($matches) {
              $first = $matches[0]
              $line = $first.LineNumber

              Write-Host "Premiere erreur detectee ligne $line"

              $start = [Math]::Max(0, $line - 16)
              $end = [Math]::Min(
                $log.Count - 1,
                $line + 18
              )

              $log[$start..$end]
            }
            else {
              Write-Host "Aucune erreur classique detectee."
              Get-Content build.log -Tail 80
            }

            throw "Compilation echouee. Consulter build.log."
          }

          Write-Host "Compilation Candle terminee avec succes."

      - name: Sauvegarder le journal de compilation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Candle-PHASE54-BUILD-LOG
          path: build.log
          if-no-files-found: ignore

      - name: Installer Candle
        shell: pwsh
        run: |
          cmake --install build --prefix "$env:GITHUB_WORKSPACE\portable"

          if ($LASTEXITCODE -ne 0) {
            throw "Installation de Candle echouee."
          }

          $exe = Get-ChildItem "$env:GITHUB_WORKSPACE\portable" `
            -Filter candle.exe -Recurse |
            Select-Object -First 1

          if (-not $exe) {
            throw "candle.exe introuvable apres installation."
          }

          "CANDLE_EXE=$($exe.FullName)" |
            Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Deployer les bibliotheques Qt
        shell: pwsh
        run: |
          $windeploy = "$env:QT_ROOT_DIR\bin\windeployqt.exe"

          if (-not (Test-Path $windeploy)) {
            throw "windeployqt.exe introuvable."
          }

          & $windeploy --release --compiler-runtime "$env:CANDLE_EXE"

          if ($LASTEXITCODE -ne 0) {
            throw "Le deploiement Qt a echoue."
          }

      - name: Verifier les fichiers deployes
        shell: pwsh
        run: |
          $p = "$env:GITHUB_WORKSPACE\portable"

          if (-not (Test-Path $env:CANDLE_EXE)) {
            throw "Executable absent."
          }

          Write-Host "Executable : $env:CANDLE_EXE"
          Get-ChildItem $p -Recurse | Select-Object FullName

      - name: Publier Candle PHASE54
        uses: actions/upload-artifact@v4
        with:
          name: Candle-PHASE54-Windows
          path: portable/
          if-no-files-found: error
